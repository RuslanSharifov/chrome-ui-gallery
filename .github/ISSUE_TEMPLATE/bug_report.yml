name: Bug report
description: Report a problem with an existing extension, UI design or guide
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping. Do not share passwords, cookies, tokens or personal data."
  - type: input
    id: project
    attributes:
      label: Affected project or folder
      placeholder: "Tools/cookie-manager-pro"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Click ... 3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 128 / Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error logs or screenshots
      description: Remove personal identifiers, browsing data and secrets.
