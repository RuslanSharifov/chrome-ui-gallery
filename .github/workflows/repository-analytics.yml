name: Repository analytics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate traffic SVG
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node scripts/generate-traffic.mjs
      - name: Publish chart to analytics-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chrome-ui-analytics
          cp analytics-output/traffic.svg /tmp/chrome-ui-analytics/traffic.svg
          cd /tmp/chrome-ui-analytics
          git init -b analytics-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic.svg
          git commit -m "chore: refresh repository traffic"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin analytics-data
