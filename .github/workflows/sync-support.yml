name: Sync support metadata
on:
  push:
    branches: [main]
    paths: [docs/support-config.json]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-support.mjs
      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-support
          delete-branch: true
          title: "chore: sync GitHub Ko-fi links with support config"
          commit-message: "chore: synchronize GitHub support links"
          body: "Automatically generated from docs/support-config.json. Review and merge to apply GitHub README and Sponsor changes."
