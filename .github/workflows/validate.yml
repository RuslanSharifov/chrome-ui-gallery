name: Validate gallery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate gallery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/build-catalog.mjs
          node --check scripts/test-catalog.mjs
          node --check scripts/validate.mjs
          node --check docs/app.js
          node --check templates/chrome-extension-tool/popup.js
      - name: Build catalog from extension manifests
        run: node scripts/build-catalog.mjs
      - name: Ensure committed catalog matches extension manifests
        run: git diff --exit-code -- docs/catalog.json
      - name: Confirm new projects are auto-discovered
        run: node scripts/test-catalog.mjs
      - name: Validate source links, manifests and generated catalog
        run: node scripts/validate.mjs
