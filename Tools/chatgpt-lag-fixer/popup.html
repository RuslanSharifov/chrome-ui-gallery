<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 14px; margin: 0; color: #222; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; font-size: 13px; }
    input[type="number"] { width: 64px; padding: 4px; }
    .hint { font-size: 11px; color: #777; margin-top: 12px; line-height: 1.4; }
    .saved { font-size: 11px; color: #2a8; height: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>ChatGPT Lag Fixer</h1>
  <label>Enabled <input type="checkbox" id="enabled"></label>
  <label>Viewport rendering optimization <input type="checkbox" id="contentVisibility"></label>
  <label>Lighten effects on older messages <input type="checkbox" id="lightOldTurns"></label>
  <label>Recent messages kept fully active <input type="number" id="keepRecent" min="1" max="500"></label>
  <div class="saved" id="saved"></div>
  <div class="hint">Changes apply immediately. No page reload needed.</div>
  <script src="popup.js"></script>
</body>
</html>
