<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ChatGPT DARK GPT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas class="bg" id="preview" aria-hidden="true"></canvas>
  <div class="bg-fallback" aria-hidden="true"></div>
  <main class="popup">
    <header class="header">
      <div class="brand">
        <img class="brand__icon" src="icons/icon48.png" alt="" width="40" height="40">
        <div><p class="eyebrow">CHATGPT UI</p><h1>DARK GPT</h1></div>
      </div>
      <span class="chip" id="version">RED MODE</span>
    </header>

    <section class="card card--hero">
      <div><strong>Dark GPT</strong><p id="stateText">Loading…</p></div>
      <button id="enabled" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle DARK GPT"><span></span></button>
    </section>
    <p class="notice" id="tabNotice" hidden>Open <b>chatgpt.com</b> in the current tab to see the effect.</p>

    <div id="controls">
      <section class="card preview-card">
        <div class="preview-head"><p class="field-label">Live preview</p><span id="previewHint">Hover it · click to burst</span></div>
        <div class="preview-box"><canvas id="textPreview" aria-label="Particle text preview"></canvas></div>
      </section>
      <div id="sections" class="sections"></div>
    </div>

    <div class="actions">
      <button id="reset" class="btn" type="button">Reset</button>
      <a class="btn btn--ghost" href="https://github.com/RuslanSharifov/chrome-ui-gallery" target="_blank" rel="noreferrer">Repository ↗</a>
    </div>
    <p id="saveState" class="save-state" data-on="false" aria-live="polite">Saved ✓</p>
    <footer class="footer">Red ChatGPT-style identity • dark-only theme</footer>
  </main>
  <script src="./shared.js"></script>
  <script src="./fx.js"></script>
  <script src="./textfx.js"></script>
  <script src="./script.js"></script>
</body>
</html>
