<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Glassmorphism</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- live preview of the real shader: what you tune here is what ChatGPT gets -->
  <canvas class="bg" id="preview" aria-hidden="true"></canvas>
  <div class="bg-fallback" aria-hidden="true"></div>

  <main class="popup">
    <header class="header">
      <div class="brand">
        <img class="brand__icon" src="icons/icon48.png" alt="" width="40" height="40" />
        <div>
          <p class="eyebrow">CHATGPT UI</p>
          <h1>Glassmorphism</h1>
        </div>
      </div>
      <span class="chip" id="version">v2</span>
    </header>

    <section class="card card--hero">
      <div>
        <strong>Glass effect</strong>
        <p id="stateText" aria-live="polite">Loading…</p>
      </div>
      <button id="enabled" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle glass effect"><span></span></button>
    </section>

    <p class="notice" id="tabNotice" hidden>Open <b>chatgpt.com</b> in the current tab to see the effect.</p>

    <div id="controls">
      <div class="presets" id="presets" role="group" aria-label="Presets"></div>

      <div class="tabs" role="tablist" aria-label="Settings sections">
        <button class="tab" role="tab" id="tab-fx"    data-tab="fx"    aria-selected="true"  aria-controls="panel-fx">Lights</button>
        <button class="tab" role="tab" id="tab-glass" data-tab="glass" aria-selected="false" aria-controls="panel-glass">Glass</button>
        <button class="tab" role="tab" id="tab-more"  data-tab="more"  aria-selected="false" aria-controls="panel-more">More</button>
      </div>

      <section class="panel" id="panel-fx" role="tabpanel" aria-labelledby="tab-fx"></section>
      <section class="panel" id="panel-glass" role="tabpanel" aria-labelledby="tab-glass" hidden></section>
      <section class="panel" id="panel-more" role="tabpanel" aria-labelledby="tab-more" hidden></section>
    </div>

    <div class="actions">
      <button id="reset" class="btn" type="button">Reset to defaults</button>
      <a class="btn btn--ghost" href="https://github.com/RuslanSharifov/chrome-ui-gallery" target="_blank" rel="noreferrer">Repository ↗</a>
    </div>

    <footer class="footer">Text and icon colours follow ChatGPT's light / dark theme automatically.</footer>
  </main>

  <script src="./shared.js"></script>
  <script src="./fx.js"></script>
  <script src="./script.js"></script>
</body>
</html>
