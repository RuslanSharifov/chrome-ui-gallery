<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini Claymorphism</title>
  <link rel="stylesheet" href="clouds.css">
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="support.css" />
</head>
<body>
  <div id="preview-host" aria-hidden="true"></div>
  <main class="popup">
    <header class="header">
      <div><p class="eyebrow">GEMINI UI</p><h1>Claymorphism</h1></div>
      <span id="version" class="chip"></span>
    </header>

    <section class="card hero">
      <div><strong>Clay visual layer</strong><p id="stateText">Active on Gemini</p></div>
      <button id="enabled" class="switch" role="switch" aria-label="Enable Gemini Claymorphism"><span></span></button>
    </section>
    <p id="tabNotice" class="notice" hidden>Open gemini.google.com to apply the theme.</p>

    <aside class="gemini-support" data-support-remote hidden><div class="gemini-support-symbol" aria-hidden="true">♥</div><div class="gemini-support-copy"><span>COMMUNITY SUPPORTED ✦</span><strong>Enjoying this design?</strong><small>Help keep free UI experiments growing.</small></div><a href="#" target="_blank" rel="noopener noreferrer">Support ↗</a></aside>
    <div id="controls">
      <section class="card"><h2>Presets</h2><div id="presets" class="chips"></div></section>
      <div id="accordion" class="acc-list"></div>
    </div>

    <div class="actions">
      <button id="reset" class="btn" type="button">Reset</button>
      <button id="save" class="btn primary" type="button">Save</button>
      <a class="btn ghost" href="https://github.com/RuslanSharifov/chrome-ui-gallery" target="_blank" rel="noreferrer">Repository ↗</a>
    </div>
    <p id="saveState" class="save-state" data-on="false" aria-live="polite">Saved ✓</p>
    <footer>Gemini Claymorphism · visual styling only</footer>
  </main>
  <script src="support-remote.js"></script>
  <script src="shared.js"></script>
  <script src="weather.js"></script>
  <script src="clouds.js"></script>
  <script src="script.js"></script>
</body>
</html>
