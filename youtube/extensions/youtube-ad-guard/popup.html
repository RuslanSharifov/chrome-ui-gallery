<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>YouTube Ad Guard</title>
<link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body><main>
<header><span class="logo" aria-hidden="true">▶</span><span><strong>YouTube Ad Guard</strong><small>Block &amp; Auto Skip</small></span><span class="dot" id="dot"></span></header>
<section class="hero" aria-live="polite"><div class="eyebrow">PLAYBACK PROTECTION</div>
<h1 id="headline">Checking protection…</h1><p id="status">Reading your preferences</p></section>
<section class="controls" aria-label="Protection controls">
<label for="block"><span class="symbol" aria-hidden="true">◈</span><span class="copy"><b>Block ad requests</b><small>Network filtering &amp; ad elements</small></span><input class="switch" id="block" type="checkbox" role="switch"></label>
<label for="skip"><span class="symbol purple" aria-hidden="true">⏭</span><span class="copy"><b>Auto skip ads</b><small>Click, seek or accelerate ads</small></span><input class="switch" id="skip" type="checkbox" role="switch"></label>
</section><p id="message" role="status" aria-live="polite">Your preferences stay in this browser.</p>
<footer><a href="https://github.com/RuslanSharifov/chrome-ui-gallery" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
<a class="coffee" href="https://ko-fi.com/ruslansharifov" target="_blank" rel="noopener noreferrer">♥ Support on Ko-fi ↗</a></footer>
</main></body></html>
